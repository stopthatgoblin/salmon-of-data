name: Ireland gas data

on:
  push:
    branches: [main, codex/ireland-gas-live]
    paths: ['gas/**', 'electricity/research/ni_gas/**', '.github/workflows/ireland-gas.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Data store
        type: choice
        options: [preview, production]
        default: preview
      gas_day:
        description: Optional gas day YYYY-MM-DD (normally yesterday)
        type: string
        default: ''
      revision_days:
        description: Completed days to try and revise, including delayed sources (1-14)
        type: string
        default: '7'
      automatic:
        description: Skip only after all requested days and demand readings are complete
        type: boolean
        default: false
      verify_recovery:
        description: Preview only - verify date advance, missing-meter recovery and unchanged retries
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ireland-gas-${{ github.event.inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'preview') }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.repository == 'stopthatgoblin/salmon-of-data' && (github.event.inputs.target != 'production' || github.ref == 'refs/heads/main')
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GAS_TARGET: ${{ github.event.inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'preview') }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GAS_DAY: ${{ inputs.gas_day }}
      REVISION_DAYS: ${{ inputs.revision_days || '7' }}
      AUTOMATIC: ${{ inputs.automatic || 'false' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Select the isolated data store from the deployment configuration
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = 'wrangler.static.jsonc' if os.environ['GAS_TARGET'] == 'production' else 'wrangler.electricity-preview.jsonc'
          config = json.loads(Path(path).read_text())
          namespace = next(row['id'] for row in config['kv_namespaces'] if row['binding'] == 'GAS_DATA')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('GAS_KV_NAMESPACE_ID=' + namespace + '\n')
          PY
      - name: Check calculation and publication rules
        run: |
          python -m unittest discover -s gas -p 'test_*.py'
          python -m unittest discover -s electricity/research/ni_gas -p 'test_*.py'
      - name: Restore immutable reports and retained report catalogs
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: outputs/gas-live/sources
          key: gas-sources-v1-${{ env.GAS_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gas-sources-v1-${{ env.GAS_TARGET }}-
            gas-sources-v1-production-
      - name: Reject recovery replay outside preview
        if: inputs.verify_recovery && env.GAS_TARGET != 'preview'
        run: exit 1
      - name: Verify the preview publication and recovery path with real source reports
        if: inputs.verify_recovery && env.GAS_TARGET == 'preview'
        run: python -m gas.verify
      - name: Publish available gas days and retain pending source retries
        id: publish
        run: |
          python - <<'PY'
          import os, subprocess, sys
          command = [sys.executable, '-m', 'gas.cloud', '--revision-days', os.environ['REVISION_DAYS']]
          if os.environ.get('GAS_DAY'):
              command += ['--gas-day', os.environ['GAS_DAY']]
          if os.environ['AUTOMATIC'] == 'true':
              command += ['--automatic']
          subprocess.run(command, check=True)
          PY
      - name: Preserve collected reports between retries
        if: always() && !cancelled()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: outputs/gas-live/sources
          key: gas-sources-v1-${{ env.GAS_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain source evidence for changed editions
        if: steps.publish.outputs.changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gas-source-evidence-${{ env.GAS_TARGET }}-${{ github.run_id }}
          path: |
            outputs/gas-live/sources/*.gz
            outputs/gas-live/sources/*.url
            outputs/gas-live/sources/catalog-*.json
            outputs/gas-live/verification.json
          retention-days: 30
          compression-level: 0
