name: NI electricity data

on:
  # Validate collector changes against preview; refresh production when the
  # collector or its schedule changes on the default branch.
  push:
    branches: [main, codex/ni-electricity]
    paths:
      - '.github/workflows/ni-electricity.yml'
      - 'electricity/**'
  schedule:
    - cron: '2,17,32,47 * * * *'
      timezone: UTC
    - cron: '0 7 * * *'
      timezone: Europe/London
    # Catch up on a delayed/failed daily run, once an hour through the morning.
    - cron: '5 8-12 * * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset to refresh
        type: choice
        options: [snapshot, history, both]
        default: both
      target:
        description: Namespace to publish to
        type: choice
        options: [preview, production]
        default: preview
      preview_watch:
        description: Run a temporary two-hour preview test, collecting every 15 minutes
        type: boolean
        default: false

permissions:
  contents: read

# One collector at a time per namespace, including manual runs. Do not cancel
# a publication between writing accepted state and advancing its public pointer.
concurrency:
  group: ni-electricity-${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/ni-electricity' && 'preview' || github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'preview' && inputs.preview_watch && 150 || 45 }}
    if: github.repository == 'stopthatgoblin/salmon-of-data' && (github.event_name == 'push' || github.event.inputs.target == 'preview' || github.ref == 'refs/heads/main')
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Select the variable name first: an unset preview ID must fail, never
      # fall through to the production namespace.
      ELECTRICITY_KV_NAMESPACE_ID: ${{ vars[(github.event_name == 'push' && github.ref == 'refs/heads/codex/ni-electricity' || github.event.inputs.target == 'preview') && 'ELECTRICITY_PREVIEW_KV_NAMESPACE_ID' || 'ELECTRICITY_KV_NAMESPACE_ID'] }}
      PYTHONUNBUFFERED: '1'
      ELECTRICITY_FORCE: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Preserve the local collector's pre-3.12 floating-point sum behaviour.
          python-version: '3.11'
      - name: Verify collector rules
        id: rules
        run: |
          python -m unittest discover -s electricity/dashboard -p 'test_*.py'
          python -m unittest discover -s electricity -p 'test_*.py'
      - name: Refresh overview
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.dataset != 'history' || github.event.schedule == '2,17,32,47 * * * *'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python electricity/cloud.py snapshot
      - name: Refresh historical explorer
        if: always() && !cancelled() && steps.rules.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.dataset != 'snapshot' || github.event_name == 'schedule' && github.event.schedule != '2,17,32,47 * * * *')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python electricity/cloud.py history
      - name: Observe preview updates every 15 minutes
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'preview' && inputs.preview_watch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: python
        run: |
          import subprocess, time
          # Eight collections over a two-hour review window, including the
          # initial collection above. Never runs against production.
          started = time.monotonic()
          for index in range(1, 8):
              time.sleep(max(0, started + index * 900 - time.monotonic()))
              result = subprocess.run(['python', 'electricity/cloud.py', 'snapshot'])
              print(f'Preview collection {index + 1}/8: exit {result.returncode}', flush=True)
              # A source outage retains accepted data; later intervals retry.
